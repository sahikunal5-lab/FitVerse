
<!doctype html>
<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>FitOrbit</title>

    <!-- Light and Dark Mode Initialization -->

    <script>
      (() => {

        let theme = "dark";

        try {

          if (
            localStorage.getItem("fitorbit-theme") === "light"
          ) {
            theme = "light";
          }

        } catch {}

        document.documentElement.dataset.theme = theme;

      })();
    </script>

  </head>

  <body>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

  </body>

</html>
